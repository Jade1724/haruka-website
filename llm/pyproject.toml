[project]
name = "mecha-llm"
version = "0.1.0"
description = "Offline RAG pipeline (ingest, chunk, embed, index) and evaluation harness for mecha-haruka."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.13",
    "aiohttp>=3.11",
    "openai>=1.54",
    "azure-search-documents>=11.5",
    "tiktoken>=0.8",
    "tenacity>=9.0",
    "langfuse>=2.50",
]

# Heavy evaluation dependencies are optional so the core ingest/index pipeline stays lean.
# Install with: uv sync --extra eval
[project.optional-dependencies]
eval = [
    "ragas>=0.2",
    "deepeval>=1.4",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mecha_llm"]
