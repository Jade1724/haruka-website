[project]
name = "mecha-llm"
version = "0.1.0"
description = "Offline RAG pipeline (ingest, chunk, embed, index) and evaluation harness for mecha-haruka."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.13",
    "aiohttp>=3.11",
    "openai>=1.54",
    "azure-search-documents>=11.5",
    "tiktoken>=0.8",
    "tenacity>=9.0",
    "azure-monitor-opentelemetry>=1.6",
    "opentelemetry-instrumentation-openai-v2>=2.0",
    "sentence-transformers>=3.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
]

# Heavy evaluation dependencies are optional so the core ingest/index pipeline stays lean.
# Install with: uv sync --extra eval
[project.optional-dependencies]
eval = [
    "ragas>=0.2",
    "deepeval>=1.4",
    # RAGAS 0.4 targets the langchain 0.3 line; langchain 1.x moves modules it imports.
    "langchain>=0.3,<1.0",
    "langchain-community>=0.3,<1.0",
    "langchain-openai>=0.2,<1.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "sqlfluff>=3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mecha_llm"]
