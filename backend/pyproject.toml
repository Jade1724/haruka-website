[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "aiohttp>=3.11",
    "pydantic-settings>=2.13",
    "azure-monitor-opentelemetry>=1.6",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

# RAG service deps (Pi only). The Vercel deployment runs journal/contact + the
# /chat proxy on the base deps above and never imports these.
# Install with: uv sync --extra rag
[project.optional-dependencies]
rag = [
    "openai>=1.54",
    "opentelemetry-instrumentation-openai-v2>=2.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "sentence-transformers>=5.6.1",
    # Direct dep so the CPU-index source below is honored (it's otherwise a
    # transitive dep of sentence-transformers, which uv sources don't reach).
    "torch>=2.2",
]

# The Pi has no GPU: pull torch from PyTorch's CPU wheel index on Linux so the
# multi-GB nvidia-cuda-* dependency tree is never installed. macOS keeps the
# default PyPI wheel (MPS) for local dev.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
