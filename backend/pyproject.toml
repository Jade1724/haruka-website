[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "aiohttp>=3.11",
    "pydantic-settings>=2.13",
    "azure-monitor-opentelemetry>=1.6",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

# RAG service deps (Pi only). The Vercel deployment runs journal/contact + the
# /chat proxy on the base deps above and never imports these.
# Install with: uv sync --extra rag
[project.optional-dependencies]
rag = [
    "openai>=1.54",
    "opentelemetry-instrumentation-openai-v2>=2.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "sentence-transformers>=5.6.1",
]
